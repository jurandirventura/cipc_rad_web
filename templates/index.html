<!DOCTYPE html>

<head>

<meta charset="utf-8">
<title>CIPC Viewer</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

href="/static/style.css"/>

</head>

<body>

<div id="sidebar">

<h2>CIPC Viewer</h2>

Produto<br>
<select id="produto"></select><br><br>

Ano<br>
<select id="ano"></select><br><br>

Data<br>
<select id="data"></select><br><br>

<button onclick="addLayer()">Adicionar camada</button>

<button onclick="toggleTimeline()">☰</button>

<hr>

<h3>Camadas</h3>

<hr>

<div id="layersPanel"></div>


<div id="pixelValues"
style="
position:absolute;
bottom:15px;
right:15px;
background:rgba(255,255,255,0.9);
padding:10px;
font-size:12px;
border-radius:6px;
box-shadow:0 0 6px rgba(0,0,0,0.3);
z-index:1000;">
Pixel values
</div>

<h3>Legendas</h3>

<div id="legendPanel"></div>

<!-- <div id="map"></div> -->

<div id="map" style="height:100vh;"></div>

<!-- Área para Timeline e gráfico-->

<div id="timelinePanel">
    
    
<h3>Timeline</h3>

Data inicial<br>
<input type="date" id="startDate"><br><br>

Data final<br>
<input type="date" id="endDate"><br><br>

<button onclick="loadTimeline()">Carregar Timeline</button>
<button onclick="playTimeline()">▶ Play</button>
<button onclick="stopTimeline()">■ Stop</button>

<br><br>

Velocidade<br>
<input id="speedSlider" type="range" min="100" max="2000" step="100" value="500">
<span id="speedLabel">500 ms</span>

<br><br>

id="timeSlider"
min="0"
max="0"
value="0"
step="1">



<br>

<span id="timeLabel"></span>

<br><br>

<button onclick="downloadCSV()">Download CSV</button>

</div>

  <div id="chartHeader">📊 Série Temporal (arrastar)</div>
